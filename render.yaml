services:
  - type: web
    name: argus-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: argus-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: API_PORT
        value: 3000
      - key: RENDER
        value: "true"
      - key: OWNER_USERNAME
        value: ShadowPace
